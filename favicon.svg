  <path fill="#42B7B4" d="M114 182 C112 138 98 100 72 74 C58 120 78 160 114 182 Z"/>
  <path fill="#D6B76D" d="M126 182 C128 138 142 100 168 74 C182 120 162 160 126 182 Z"/>
  <circle class="f" fill="#0D345E" cx="120" cy="40" r="23"/>
