<?xml version="1.0" encoding="utf-8"?>
<!--
  بيان — أيقونة الموقع. علامة أكتوبر ٢٠٢٦: وعاءُ النون تتفتّح منه
  ورقتان وفوقه نقطته — حبرٌ كحليٌّ على أرضيةٍ شفافة.

  ① بلا بلاطة — قرارُ المالك (٦ أكتوبر): العلامةُ الداكنة على شفاف،
     لا البيضاء على بلاطةٍ كحليّة. والشفافيةُ تردّ للعلامة مساحتَها:
     viewBox مقصوصٌ على مدى الحبر (هامشٌ نحو ٥ وحدات) فتملأ لسان
     التبويب بدل أن تنكمش داخل بلاطة.

  ② والحبرُ يتبع لونَ المتصفّح لا سِمةَ بيان: الأيقونة تُرى في لسان
     التبويب، ولسانُ التبويب من المتصفّح لا من الصفحة. فكحليٌّ في
     المتصفّح الفاتح، وأبيضُ في الداكن (prefers-color-scheme أدناه).
     وبلا هذا يذوب الكحليُّ في اللسان الداكن: تباينُه معه بين ١٫٠
     و١٫٣ إلى ١ (قيس على ‎#35363A و‎#202124). والورقتان هويةٌ ثابتة
     في الحالين.
     ⚠️ وهذا الموضعُ الوحيد في المشروع لـprefers-color-scheme، وليس
        خرقاً لقاعدة السِمة اليدوية: سِمةُ الصفحة بـdata-theme لا يقرؤها
        ملفٌّ مرتبط أصلاً، وما يُطابَق هنا واجهةُ المتصفّح لا الصفحة.

  ③ والعلامةُ هنا رسمٌ للمقاس الصغير لا نسخةٌ مصغَّرة: هذا الملفّ يُرى
     عند ١٦px، فغُلّظت قليلاً عن علامة اللوح (الضربة ٣٦ بدل ٣٤ ·
     النقطة ٢٣ بدل ٢١ · والورقتان أعرض قليلاً) وقيست عند ١٦ و٣٢ و٤٨
     على لسانٍ فاتح وداكن.
     ⚠️ فلا تُنسخ هندستُه إلى الشعار، ولا هندسةُ الشعار إليه: الشعارُ
        في index.html بنِسَبه الأصلية (٣٤ · ٢١)، وهذا تصحيحٌ بصريّ لمقاسه.

  ④ الألوان هي طبقةُ الهوية نفسها في css/base.css حرفاً بحرف —
     غيّرتَها هناك؟ غيّرها هنا (ولا تُكتب أسماؤها بشرطتيها: شرطتان
     متتاليتان تُبطلان تعليق XML، فيفسد الملفّ — وقع وأُصلح).

  ⑤ ومن هذا الملفّ تُولَّد أخواتُه: favicon.ico (١٦ · ٣٢ · ٤٨)
     وicon-192.png — كحليّتان على شفاف، ولا تتبعان لونَ المتصفّح
     (الصورةُ النقطية لا تقرأ الاستعلام؛ وهما احتياطٌ لمن لا يقرأ SVG).
     أمّا apple-touch-icon.png فعلى أرضيةٍ بيضاء تامّة بلا استدارة:
     iOS يملأ الشفافيةَ سواداً ويقصّ الأركان بنفسه.
     غُيّر هذا؟ أُعيد توليدُها معه.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 12 218 218" width="512" height="512">
  <title>بيان</title>
  <style>@media (prefers-color-scheme:dark){.s{stroke:#FFFFFF}.f{fill:#FFFFFF}}</style>
