<!--
  بيان — أيقونة الموقع. قلنسوةُ تخرّجٍ فوق نبتةٍ تتفتّح.

  ① viewBox محسوبٌ لا منقول: مقاسُ المصدّر (2595×2424) مستطيلٌ فارغٌ
     حول الرسم، فكانت الأيقونةُ ذرّةً في إطار — تشغل ٦٤٪ عرضاً و٨٤٪
     ارتفاعاً ومزاحةً عن مركزها. قيس الرسمُ بـgetBBox في المتصفّح نفسه
     (x 467.4 · y 168.4 · 1657.4 × 2045.6)، فصار الإطارُ مربّعاً حوله:
     ضلعُه ٢٢٨٠ يترك هامشاً ٥٪ رأسيّاً — وهو ما يُقرأ عند ١٦px في
     لسان التبويب. والنسخةُ السابقة كانت تضيع عنده.

  ② الألوان من الهوية لا من المصدّر: خرج بـ#0D355E و#42B7B3 و#D6B76F،
     وهي تجاور متغيّرات «brand-navy» و«brand-teal» و«brand-gold» ولا
     تطابقها. وأيقونةٌ تُرى بجوار الشعار تُقاس عليه. (انظر css/base.css
     — طبقة الهوية. ولا تُكتب أسماؤها هنا بشرطتيها: شرطتان متتاليتان
     تُبطلان تعليقَ XML، فيصير الملفّ فاسداً — وقع وأُصلح.)

  ③ ولا كتلةَ بيانات: الأصلُ المرسَل ٤٣KB، تسعون بالمئة منها بيانُ
     أصالةٍ مضمَّنٌ من المولّد. وأيقونةٌ تُحمَّل في كلّ صفحةٍ لا تحمل
     ذلك. والأصلُ بتوقيعه باقٍ في Downloads لمن أراد إثباتَ المصدر.
     (ولا يُذكر اسمُ الوسم هنا حرفيّاً: فحصٌ نصّيٌّ يبحث عنه يجده في
     التعليق الذي يشرح غيابَه — فيُنذر كاذباً. والفحصُ الصادق بنيويّ:
     يعدّ عناصرَ المستند لا يطابق حروفَه.)

  ⚠️ وهي ثابتةُ الألوان لا تتبع السِمة: الـSVG المرتبطُ كملفّ لا يقرأ
     متغيّرات CSS للصفحة المضيفة، والسِمة في بيان يدويّةٌ بـdata-theme
     لا بـprefers-color-scheme. وألوانُها الثلاثة تُقرأ على الورقين.
-->
