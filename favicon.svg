<?xml version="1.0" encoding="utf-8"?>
<!--
  بيان — أيقونة الموقع. علامة أكتوبر ٢٠٢٦: وعاءُ النون تتفتّح منه
  ورقتان وفوقه نقطته — على بلاطةٍ كحليّةٍ مستديرة الأركان.

  ① البلاطة من لوح التصميم («A · Versions» — خانة favicon): نسبةُ
     استدارتها ١٣/٥٦ من ضلعها (هنا ٥٦/٢٤٠)، والعلامةُ ثلاثةُ أرباعها
     (٤٢/٥٦ ⇒ scale .75 حول المركز). والبلاطةُ ضرورةٌ لا زينة: حبرُ
     العلامة أبيض، وبلا أرضيةٍ كحليّة يذوب في ألسنة التبويب الفاتحة.

  ② وثابتةُ الألوان لا تتبع السِمة: الـSVG المرتبطُ كملفّ لا يقرأ
     متغيّرات CSS للصفحة المضيفة، والسِمة في بيان يدويّةٌ بـdata-theme
     لا بـprefers-color-scheme. والكحليُّ يُقرأ على لوحتَي المتصفّح
     الفاتحة والداكنة معاً.

  ③ الألوان هي طبقةُ الهوية نفسها في css/base.css حرفاً بحرف —
     غيّرتَها هناك؟ غيّرها هنا (ولا تُكتب أسماؤها بشرطتيها: شرطتان
     متتاليتان تُبطلان تعليق XML، فيفسد الملفّ — وقع وأُصلح).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <title>بيان</title>
  <rect width="240" height="240" rx="56" fill="#0D345E"/>
  <g transform="translate(30 30) scale(.75)">
    <path fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" d="M40 104 V128 A80 80 0 0 0 200 128 V104"/>
    <path fill="#42B7B4" d="M115 184 C113 140 100 102 74 74 C62 118 80 160 115 184 Z"/>
    <path fill="#D6B76D" d="M125 184 C127 140 140 102 166 74 C178 118 160 160 125 184 Z"/>
    <circle fill="#FFFFFF" cx="120" cy="40" r="21"/>
  </g>
</svg>
