# فحصُ انحراف العلامة.
#
# لماذا يوجد: هندسةُ العلامة مكرَّرةٌ في ثمانيةَ عشرَ موضعاً نصّيّاً، ولا
# رابطَ بينها. والتكرارُ لا يُزال (الـSVG الخارجيّ لا يقرأ متغيّرات CSS،
# ومشهدُ الافتتاح يحتاج مجموعاته في المستند) — فالعلاج ألّا يصمت.
#
# 🔑 وهذه هي القطعة التي تجعل الخطأ صاخباً. المولِّدُ والمصدرُ بلا هذا
#    الملفّ نيّةٌ حسنةٌ تُنسى في أوّل جولةٍ مستعجلة.
#
# ويعمل بلا متصفّحٍ ولا اعتماديّات — Node وحده، فهو ثوانٍ لا دقائق.

name: فحص انحراف العلامة

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: العلامة متّسقة في مواضعها؟
        run: node brand/brand.mjs check
