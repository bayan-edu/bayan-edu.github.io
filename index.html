<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182a">
<meta name="description" content="بيان — منصة تعلم عربية تشرح لك لماذا أخطأت، لا أنك أخطأت فقط.">
<title>بيان — تعلم صح</title>

<script>try{var t=localStorage.getItem("bayan.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- شريط علوي لاصق: يشغله عدّاد الاختبار -->
<div id="bar"></div>

<div class="wrap">
  <header>
    <div class="brand has-logo" id="brand">
      <img class="brand-logo" id="logo" alt="بيان"
           onload="this.style.display='block';this.parentNode.classList.add('has-logo')"
           onerror="this.remove()">
      <span class="brand-text"><span class="brand-name">بيان</span><span class="brand-slogan">تعلم صح</span></span>
    </div>
    <h1 id="head"></h1>
    <p class="sub" id="subhead"></p>
  </header>

  <!-- كل الشاشات تُرسم داخل هذا العنصر -->
  <div id="app"><div class="status">جارٍ الاتصال…</div></div>
</div>

<div class="toast" id="toast">تم</div>

<noscript>
  <div class="wrap"><div class="err"><b>جافاسكربت معطّلة</b>
    فعّلها في المتصفح لتعمل المنصة.</div></div>
</noscript>

<script type="module">
  import { start } from './js/auth.js';
  start();
</script>
</body>
</html>
