<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--card:#102f4c;--card2:#0c243b;--foam:#eaf4f8;--mist:#9db8c9;
 --cyan:#48cfc0;--coral:#f2776b;--sand:#e5bd63;--line:rgba(157,184,201,.18);--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(72,207,192,.10),transparent 60%),
 linear-gradient(180deg,#0d2b45 0%,#07182a 55%,#04101c 100%);background-attachment:fixed;
 color:var(--foam);font-family:'Readex Pro','Almarai',system-ui,Tahoma,sans-serif;
 font-weight:300;line-height:1.85;padding:0 0 90px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header{padding:28px 0 14px;text-align:center}
.eyebrow{font-family:'Almarai';font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--cyan);margin-bottom:9px}
h1{font-family:'Almarai';font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.35}
.sub{color:var(--mist);font-size:.88rem;margin-top:6px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
 border-radius:var(--r);padding:22px 20px;margin-bottom:15px}
.qnum{font-family:'Almarai';font-weight:800;font-size:.72rem;color:var(--cyan);letter-spacing:.1em;margin-bottom:11px}
.qtext{font-family:'Almarai';font-weight:700;font-size:1.01rem;line-height:1.9;margin-bottom:16px}
.media{width:100%;border-radius:11px;border:1px solid var(--line);margin-bottom:15px;display:block}
.media-v{width:100%;aspect-ratio:16/9;border:0;border-radius:11px;margin-bottom:15px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:right;
 background:rgba(157,184,201,.05);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
 cursor:pointer;color:var(--foam);font-family:inherit;font-size:.92rem;line-height:1.75;
 transition:border-color .18s,background .18s}
.opt:hover{border-color:rgba(72,207,192,.45);background:rgba(72,207,192,.06)}
.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.opt.sel{border-color:var(--cyan);background:rgba(72,207,192,.13)}
.key{flex:0 0 26px;height:26px;border-radius:8px;background:rgba(157,184,201,.13);color:var(--mist);
 font-family:'Almarai';font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.opt.sel .key{background:var(--cyan);color:#06202e}
input,textarea{width:100%;background:rgba(157,184,201,.05);border:1px solid var(--line);
 border-radius:11px;padding:13px;color:var(--foam);font-family:inherit;font-size:.93rem;line-height:1.9}
textarea{min-height:125px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
label.fl{display:block;font-family:'Almarai';font-weight:700;font-size:.85rem;margin-bottom:8px}
.small{font-size:.78rem;color:var(--mist);margin-top:7px;text-align:right;line-height:1.7}
.nav{display:flex;gap:10px;margin-top:6px}
button.btn{flex:1;border:none;border-radius:11px;padding:13px 18px;cursor:pointer;
 font-family:'Almarai';font-weight:800;font-size:.9rem;transition:transform .12s,filter .18s}
button.btn:active{transform:translateY(1px)}
button.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.primary{background:var(--cyan);color:#06202e}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:rgba(157,184,201,.09);color:var(--foam);border:1px solid var(--line)!important}
.tabs,.subtabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:11px;border-radius:11px;cursor:pointer;text-align:center;
 font-family:'Almarai';font-weight:800;font-size:.87rem;background:rgba(157,184,201,.07);
 border:1px solid var(--line);color:var(--mist)}
.tab.on{background:rgba(72,207,192,.14);border-color:var(--cyan);color:var(--cyan)}
.timerbar{position:sticky;top:0;z-index:20;background:rgba(7,24,42,.93);border-bottom:1px solid var(--line);
 padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.clock{font-family:'Almarai';font-weight:800;font-size:1.12rem;color:var(--cyan);
 font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock.warn{color:var(--sand)}
.clock.crit{color:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.track{flex:1;height:5px;background:rgba(157,184,201,.14);border-radius:99px;overflow:hidden}
.trackfill{height:100%;background:linear-gradient(90deg,var(--cyan),#2a8fb8);transition:width 1s linear}
.qcount{font-family:'Almarai';font-weight:700;font-size:.76rem;color:var(--mist);white-space:nowrap}
.qz{display:flex;justify-content:space-between;align-items:center;gap:12px;
 background:rgba(157,184,201,.05);border:1px solid var(--line);border-radius:12px;
 padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .18s,background .18s}
.qz:hover{border-color:var(--cyan);background:rgba(72,207,192,.08)}
.qz.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.qz.locked:hover{border-color:var(--line);background:rgba(157,184,201,.05)}
.qz-t{font-family:'Almarai';font-weight:700;font-size:.95rem}
.qz-m{font-size:.76rem;color:var(--mist);margin-top:3px}
.qz-go{font-family:'Almarai';font-weight:800;font-size:.8rem;color:var(--cyan);white-space:nowrap}
.lockmsg{font-size:.74rem;color:var(--sand);margin-top:5px}
.badge{display:inline-block;font-family:'Almarai';font-weight:800;font-size:.66rem;
 padding:2px 9px;border-radius:999px;margin-right:7px}
.badge.ok{background:rgba(72,207,192,.16);color:var(--cyan)}
.badge.lock{background:rgba(157,184,201,.14);color:var(--mist)}
.score-hero{text-align:center;padding:30px 20px;border-radius:var(--r);
 background:linear-gradient(180deg,rgba(72,207,192,.14),rgba(16,47,76,.6));
 border:1px solid rgba(72,207,192,.3);margin-bottom:16px}
.score-num{font-family:'Almarai';font-weight:800;font-size:clamp(2.4rem,11vw,3.5rem);line-height:1;color:var(--cyan)}
.score-of{color:var(--mist);font-size:.92rem;margin-top:6px}
.verdict{font-family:'Almarai';font-weight:700;margin-top:13px;font-size:.98rem}
.unlocked{margin-top:14px;background:rgba(72,207,192,.1);border:1px solid rgba(72,207,192,.3);
 border-radius:11px;padding:12px;font-family:'Almarai';font-weight:700;font-size:.86rem;color:var(--cyan)}
.rev{border-right:3px solid var(--line);padding:15px;margin-bottom:11px;
 background:rgba(157,184,201,.04);border-radius:0 11px 11px 0}
.rev.ok{border-right-color:var(--cyan)}
.rev.no{border-right-color:var(--coral)}
.rev-q{font-family:'Almarai';font-weight:700;font-size:.9rem;margin-bottom:9px}
.tag{display:inline-block;font-family:'Almarai';font-weight:800;font-size:.68rem;
 padding:3px 10px;border-radius:999px;margin-bottom:8px}
.tag.ok{background:rgba(72,207,192,.16);color:var(--cyan)}
.tag.no{background:rgba(242,119,107,.16);color:var(--coral)}
.line{font-size:.84rem;color:var(--mist);margin-bottom:5px}
.line b{color:var(--foam);font-weight:400}
.trap{margin-top:9px;background:rgba(229,189,99,.09);border:1px solid rgba(229,189,99,.28);
 border-radius:10px;padding:11px 13px;font-size:.82rem;color:#f0dcae}
.trap strong{font-family:'Almarai';font-weight:800;color:var(--sand)}
.model{margin-top:11px;background:rgba(72,207,192,.07);border:1px solid rgba(72,207,192,.22);
 border-radius:10px;padding:13px 15px;font-size:.85rem;line-height:1.9}
.model strong{font-family:'Almarai';font-weight:800;color:var(--cyan);display:block;margin-bottom:5px}
h2.sec{font-family:'Almarai';font-weight:800;font-size:1.02rem;margin:24px 0 13px;
 padding-right:12px;border-right:3px solid var(--cyan)}
.status{text-align:center;padding:26px 14px;color:var(--mist);font-size:.88rem}
.err{background:rgba(242,119,107,.1);border:1px solid rgba(242,119,107,.3);border-radius:11px;
 padding:15px;font-size:.85rem;color:#ffd7d2;margin-bottom:14px}
.err b{font-family:'Almarai';font-weight:800;display:block;margin-bottom:5px}
.fbnote{margin-top:14px;background:rgba(229,189,99,.12);border:1px solid rgba(229,189,99,.4);
 border-radius:11px;padding:13px;font-family:'Almarai';font-weight:700;font-size:.87rem;
 color:var(--sand);cursor:pointer;text-align:center}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:.88rem;line-height:1.85}
.msg .who{font-family:'Almarai';font-weight:800;font-size:.7rem;opacity:.75;margin-bottom:4px}
.msg .tm{font-size:.68rem;opacity:.55;margin-top:5px}
.msg.me{align-self:flex-end;background:rgba(72,207,192,.16);border:1px solid rgba(72,207,192,.35)}
.msg.them{align-self:flex-start;background:rgba(157,184,201,.08);border:1px solid var(--line)}
.thr{display:flex;justify-content:space-between;align-items:center;gap:12px;
 background:rgba(157,184,201,.05);border:1px solid var(--line);border-radius:12px;
 padding:14px;margin-bottom:9px;cursor:pointer}
.thr:hover{border-color:var(--cyan)}
.dot{background:var(--sand);color:#1a1206;font-family:'Almarai';font-weight:800;
 font-size:.7rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pend{background:rgba(157,184,201,.05);border:1px solid var(--line);border-radius:12px;
 padding:15px;margin-bottom:10px;cursor:pointer}
.pend:hover{border-color:var(--cyan)}
.pend.done{border-color:rgba(72,207,192,.35);opacity:.7}
.essaybox{background:rgba(157,184,201,.05);border:1px solid var(--line);border-radius:11px;
 padding:14px;font-size:.86rem;line-height:1.95;white-space:pre-wrap;margin-bottom:14px}
.hint{color:var(--mist);font-size:.79rem;margin-top:10px;text-align:center}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(90px);
 background:var(--cyan);color:#06202e;padding:11px 22px;border-radius:999px;
 font-family:'Almarai';font-weight:800;font-size:.85rem;transition:transform .35s;z-index:60}
.toast.show{transform:translateX(50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="bar"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">منصة الاختبارات التشخيصية</div>
    <h1 id="head">جارٍ التحميل…</h1>
    <p class="sub" id="subhead"></p>
  </header>
  <div id="app"><div class="status">جارٍ الاتصال…</div></div>
</div>
<div class="toast" id="toast">تم</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ═══════════════════════════════════════════════════
   ⚙️ الإعداد الوحيد المطلوب
   انسخ القيمتين من: Supabase → Project Settings → API
   ═══════════════════════════════════════════════════ */
const SUPABASE_URL  = "https://tjzrfevymfpktfuormhs.supabase.co";
const SUPABASE_ANON = "ضع_مفتاح_publishable_هنا";   // sb_publishable_... — كشفه آمن مع RLS

const db = createClient(SUPABASE_URL, SUPABASE_ANON);

/* ─────────── أدوات ─────────── */
const L  = ["أ","ب","ج","د"];
const AR = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[+d]);
const app = document.getElementById("app"), bar = document.getElementById("bar");
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mmss = s => { const m=Math.floor(s/60),x=s%60; return m+":"+(x<10?"0":"")+x; };
function head(t,s){ document.getElementById("head").textContent=t;
  document.getElementById("subhead").textContent=s||""; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2800); }
const SAFE = /^https:\/\/(drive\.google\.com|lh3\.googleusercontent\.com|www\.youtube\.com|youtu\.be|i\.imgur\.com)\//;
function media(q){
  let h="";
  if(q.image && SAFE.test(q.image)) h+=`<img class="media" src="${esc(q.image)}" alt="" loading="lazy">`;
  if(q.video && SAFE.test(q.video)) h+=`<iframe class="media-v" src="${esc(q.video)}" allowfullscreen></iframe>`;
  return h;
}

let S = { user:null, prof:null, quizzes:[], quiz:null, i:0, ans:[], t0:0, left:0,
          tick:null, result:null, view:"gate" };

/* ═══════════ ① المصادقة ═══════════ */
let GATE = "login";

function renderGate(msg){
  bar.innerHTML="";
  head("منصة الاختبارات التشخيصية",
       GATE==="login" ? "سجّل الدخول لمتابعة تقدّمك" : "أنشئ حسابك في نصف دقيقة");
  const reg = GATE==="register";
  app.innerHTML=`
    <div class="tabs">
      <div class="tab ${reg?'':'on'}" data-g="login">تسجيل الدخول</div>
      <div class="tab ${reg?'on':''}" data-g="register">حساب جديد</div>
    </div>
    ${msg?`<div class="err"><b>تنبيه</b>${esc(msg)}</div>`:''}
    <div class="card">
      <label class="fl">البريد الإلكتروني</label>
      <input type="email" id="em" placeholder="name@example.com" autocomplete="email">
      <label class="fl" style="margin-top:16px">كلمة المرور</label>
      <input type="password" id="pw" placeholder="٦ أحرف على الأقل" autocomplete="${reg?'new-password':'current-password'}">
      ${reg?`
      <label class="fl" style="margin-top:16px">اسمك كما يظهر في التقارير</label>
      <input type="text" id="nm" placeholder="الاسم الثلاثي">
      <label class="fl" style="margin-top:16px">الصف / المدرسة <span style="opacity:.6">(اختياري)</span></label>
      <input type="text" id="kl" placeholder="مثال: أولى ثانوي — مدرسة النيل">`:''}
    </div>
    <div class="nav"><button class="btn primary" id="go">${reg?'إنشاء الحساب':'دخول'}</button></div>
    ${reg?'':'<p class="hint" id="fp" style="cursor:pointer;text-decoration:underline">نسيت كلمة المرور؟</p>'}`;

  app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ GATE=t.dataset.g; renderGate(); });
  document.getElementById("go").onclick=submitGate;
  ["em","pw","nm","kl"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.onkeydown=e=>{ if(e.key==="Enter") submitGate(); };
  });
  const fp=document.getElementById("fp");
  if(fp) fp.onclick=async()=>{
    const em=(document.getElementById("em").value||"").trim();
    if(!em){ toast("اكتب بريدك أولاً"); return; }
    const { error } = await db.auth.resetPasswordForEmail(em);
    toast(error ? "تعذّر الإرسال" : "أُرسل رابط الاستعادة لبريدك");
  };
  document.getElementById("em").focus();
}

async function submitGate(){
  const reg = GATE==="register";
  const em=(document.getElementById("em").value||"").trim();
  const pw=(document.getElementById("pw").value||"").trim();
  if(!em||!pw){ toast("أكمل البريد وكلمة المرور"); return; }
  if(pw.length<6){ toast("كلمة المرور ٦ أحرف على الأقل"); return; }

  const nm=(document.getElementById("nm")||{}).value||"";
  const kl=(document.getElementById("kl")||{}).value||"";
  if(reg && !nm.trim()){ toast("اكتب اسمك كما يظهر في التقارير"); return; }

  app.innerHTML=`<div class="status">جارٍ التحقق…</div>`;
  const r = reg
    ? await db.auth.signUp({ email:em, password:pw,
        options:{ data:{ full_name:nm.trim(), klass:kl.trim() } } })
    : await db.auth.signInWithPassword({ email:em, password:pw });

  if(r.error){ renderGate(translate(r.error.message)); return; }
  if(reg && !r.data.session){
    renderGate("تم إنشاء حسابك ✅ افتح بريدك واضغط رابط التفعيل ثم سجّل الدخول.");
    GATE="login"; return;
  }
  await boot();
}

function translate(m){
  if(/Invalid login/i.test(m)) return "البريد أو كلمة المرور غير صحيحة";
  if(/already registered/i.test(m)) return "هذا البريد مسجّل بالفعل — سجّل الدخول";
  if(/Email not confirmed/i.test(m)) return "فعّل بريدك أولاً من رابط التفعيل";
  return m;
}

/* ═══════════ ② الإقلاع ═══════════ */
async function boot(){
  const { data:{ user } } = await db.auth.getUser();
  if(!user){ renderGate(); return; }
  S.user = user;
  const { data:p } = await db.from('profiles').select('*').eq('id', user.id).single();
  S.prof = p || { full_name:'طالب', role:'student' };
  if(S.prof.role === 'teacher') loadTeacher(); else loadList();
}

async function signOut(){ await db.auth.signOut(); S.user=null; GATE="login"; renderGate(); }

/* ═══════════ ③ قائمة الاختبارات ═══════════ */
async function loadList(){
  bar.innerHTML="";
  head("أهلاً "+S.prof.full_name, (S.prof.klass? S.prof.klass+" · ":"")+"أكمل كل اختبار لتفتح الذي يليه");
  app.innerHTML=`<div class="status">جارٍ تحميل الاختبارات…</div>`;

  const { data, error } = await db.rpc('list_quizzes');
  if(error){ app.innerHTML=`<div class="err"><b>تعذّر التحميل</b>${esc(error.message)}</div>`; return; }
  S.quizzes = data||[];

  const { count } = await db.from('attempts').select('id',{count:'exact',head:true})
    .eq('user_id',S.user.id).not('teacher_comment','is',null).eq('read_by_student',false);

  app.innerHTML=`
    ${S.quizzes.map((q,k)=>`
      <div class="qz ${q.locked?'locked':''}" data-k="${k}">
        <div>
          <div class="qz-t">${esc(q.title)}
            ${q.best!==null?`<span class="badge ok">أُنجز ${AR(q.best)}٪</span>`:''}
            ${q.locked?'<span class="badge lock">مُقفل</span>':''}</div>
          <div class="qz-m">${AR(q.mcq_count)} اختيار من متعدد · ${AR(q.essay_count)} مقالي · ${AR(q.minutes)} دقيقة</div>
          ${q.locked?`<div class="lockmsg">${esc(q.reason)}</div>`:''}
        </div>
        <div class="qz-go">${q.locked?'🔒':(q.best!==null?'أعد ←':'ابدأ ←')}</div>
      </div>`).join("")}
    ${count?`<div class="fbnote" id="fbgo">📩 لديك ${AR(count)} ملاحظة جديدة من معلمك</div>`:''}
    <div class="nav" style="margin-top:16px">
      <button class="btn ghost" id="fball">ملاحظات معلمي</button>
      <button class="btn ghost" id="msgs">مراسلة المعلم</button>
    </div>
    <div class="nav"><button class="btn ghost" id="out">خروج</button></div>`;

  app.querySelectorAll(".qz").forEach(el=>el.onclick=()=>{
    const q=S.quizzes[+el.dataset.k];
    if(q.locked){ toast(q.reason); return; }
    startQuiz(q);
  });
  document.getElementById("fball").onclick=loadFeedback;
  document.getElementById("msgs").onclick=loadChat;
  document.getElementById("out").onclick=signOut;
  const fg=document.getElementById("fbgo"); if(fg) fg.onclick=loadFeedback;
}

/* ═══════════ ④ الاختبار ═══════════ */
async function startQuiz(meta){
  app.innerHTML=`<div class="status">جارٍ تحميل الأسئلة…</div>`;
  const { data, error } = await db.rpc('get_quiz', { p_quiz: meta.id });
  if(error){ toast(error.message); loadList(); return; }

  S.quiz = data;
  S.i = 0;
  S.ans = data.questions.map(q=>({ q:q.id, kind:q.kind, o:null, essay:"", sec:0, chg:0 }));
  S.left = data.minutes*60; S.t0 = Date.now(); S.qenter = Date.now();
  clearInterval(S.tick);
  S.tick = setInterval(()=>{
    S.left--; paintClock();
    if(S.left<=0){ clearInterval(S.tick); toast("انتهى الوقت — تسليم تلقائي"); finish(true); }
  },1000);
  renderQ();
}

function bankTime(){ S.ans[S.i].sec += Math.round((Date.now()-S.qenter)/1000); S.qenter=Date.now(); }

function paintClock(){
  const c=document.getElementById("clock"); if(!c) return;
  c.textContent=mmss(Math.max(0,S.left));
  c.className="clock"+(S.left<=60?" crit":(S.left<=300?" warn":""));
  const f=document.getElementById("tf");
  if(f) f.style.width=Math.max(0,(S.left/(S.quiz.minutes*60))*100)+"%";
}

function renderQ(){
  const qs=S.quiz.questions, q=qs[S.i], a=S.ans[S.i], n=qs.length;
  head(S.quiz.title,"أجب بتأنٍ — كل خيار خاطئ يمثل فخاً مقصوداً");
  bar.innerHTML=`<div class="timerbar">
    <span class="clock" id="clock">${mmss(S.left)}</span>
    <span class="track"><span class="trackfill" id="tf"></span></span>
    <span class="qcount">${AR(S.i+1)} / ${AR(n)}</span></div>`;
  paintClock();

  const body = q.kind==='mcq'
    ? `<div class="opts">${q.options.map((o,j)=>`
         <button class="opt ${a.o===o.id?'sel':''}" data-o="${o.id}">
           <span class="key">${esc(o.label||L[j])}</span><span>${esc(o.body)}</span></button>`).join("")}</div>`
    : `<textarea id="ta" placeholder="اكتب السلسلة السببية كاملة…">${esc(a.essay)}</textarea>`;

  app.innerHTML=`
    <div class="card">
      <div class="qnum">سؤال ${AR(S.i+1)} · ${q.kind==='mcq'?'اختيار من متعدد':'مقالي قصير'}</div>
      ${media(q)}
      <div class="qtext">${esc(q.body)}</div>
      ${body}
    </div>
    <div class="nav">
      ${S.i>0?'<button class="btn ghost" id="prev">السابق</button>':''}
      <button class="btn primary" id="next" ${q.kind==='mcq'&&a.o===null?'disabled':''}>
        ${S.i===n-1?'إنهاء وتسليم':'التالي'}</button>
    </div>`;

  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.o;
    if(a.o!==null && a.o!==v) a.chg++;
    a.o=v; renderQ();
  });
  const ta=document.getElementById("ta"); if(ta) ta.oninput=e=>a.essay=e.target.value;
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{ bankTime(); S.i--; renderQ(); };
  document.getElementById("next").onclick=()=>{
    bankTime();
    if(S.i===n-1) finish(false); else { S.i++; renderQ(); }
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

async function finish(auto){
  clearInterval(S.tick); bankTime();
  app.innerHTML=`<div class="status">جارٍ التصحيح…</div>`; bar.innerHTML="";

  const payload = S.ans.map(a => a.kind==='mcq'
    ? { q:a.q, o:a.o, sec:a.sec, chg:a.chg }
    : { q:a.q, essay:a.essay, sec:a.sec });

  const { data, error } = await db.rpc('submit_attempt', {
    p_quiz: S.quiz.id, p_answers: payload,
    p_duration: Math.round((Date.now()-S.t0)/1000), p_auto: auto
  });
  if(error){ app.innerHTML=`<div class="err"><b>تعذّر التسليم</b>${esc(error.message)}</div>`; return; }

  S.result = { ...data, auto, secs: Math.round((Date.now()-S.t0)/1000) };
  renderResult();
}

function verdict(p){
  if(p>=90) return "إتقان ممتاز — أنت جاهز للدرس التالي";
  if(p>=75) return "جيد جداً — راجع الفخاخ أدناه للإتقان التام";
  if(p>=50) return "تحتاج مراجعة مركّزة — ابدأ بالأسئلة الحمراء";
  return "أعد قراءة الدرس ثم أعد المحاولة";
}

function renderResult(){
  const r=S.result;
  head("نتيجتك", S.quiz.title);
  const opt = id => {
    for(const q of S.quiz.questions) for(const o of (q.options||[])) if(o.id===id) return o;
    return null;
  };
  const mcq = r.review.filter(x=>x.kind==='mcq').map((x,i)=>{
    const c=opt(x.chosen), k=opt(x.correct);
    return `<div class="rev ${x.is_correct?'ok':'no'}">
      <span class="tag ${x.is_correct?'ok':'no'}">${x.is_correct?'صحيحة':'خاطئة'}</span>
      <div class="rev-q">${AR(i+1)}. ${esc(x.body)}</div>
      <div class="line">إجابتك: <b>${c?esc(c.label+') '+c.body):'— لم تُجب —'}</b></div>
      ${x.is_correct?'':`<div class="line">الصحيحة: <b>${k?esc(k.label+') '+k.body):'—'}</b></div>
        <div class="trap"><strong>تشخيص الخطأ:</strong> ${esc(x.explanation||'').replace(/\n/g,"<br>")}</div>`}
    </div>`;
  }).join("");
  const ess = r.review.filter(x=>x.kind==='essay').map((x,i)=>`
    <div class="rev">
      <div class="rev-q">${esc(x.body)}</div>
      <div class="line">إجابتك: <b>${x.essay?esc(x.essay).replace(/\n/g,"<br>"):'— لم تُكتب —'}</b></div>
      <div class="model"><strong>الإجابة النموذجية — قارن بنفسك</strong>${esc(x.model||'').replace(/\n/g,"<br>")}</div>
    </div>`).join("");

  app.innerHTML=`
    ${r.auto?'<div class="err"><b>سُلّم تلقائياً</b>انتهى الوقت قبل إنهائك للاختبار.</div>':''}
    <div class="score-hero">
      <div class="score-num">${AR(r.score)} / ${AR(r.total)}</div>
      <div class="score-of">أسئلة الاختيار من متعدد · زمن الحل ${mmss(r.secs)}</div>
      <div class="verdict">${verdict(r.pct)}</div>
      ${(r.unlocked||[]).length?`<div class="unlocked">🔓 فُتح لك الآن: ${esc(r.unlocked.join(' · '))}</div>`:''}
    </div>
    <div class="nav">
      <button class="btn primary" id="again">إعادة الاختبار</button>
      <button class="btn ghost" id="back">قائمة الاختبارات</button>
    </div>
    <h2 class="sec">المراجعة التشخيصية</h2>${mcq}
    <h2 class="sec">الأسئلة المقالية — بانتظار تصحيح معلمك</h2>${ess}`;

  document.getElementById("again").onclick=()=>startQuiz({id:S.quiz.id});
  document.getElementById("back").onclick=loadList;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ═══════════ ⑤ ملاحظات المعلم ═══════════ */
async function loadFeedback(){
  bar.innerHTML=""; head("ملاحظات معلمي", S.prof.full_name);
  app.innerHTML=`<div class="status">جارٍ التحميل…</div>`;
  const { data } = await db.from('attempts')
    .select('id,submitted_at,pct,score,total,essay_score,teacher_comment,read_by_student,quizzes(title)')
    .eq('user_id',S.user.id).not('teacher_comment','is',null)
    .order('submitted_at',{ascending:false});

  const list=data||[];
  app.innerHTML=`
    ${list.length?list.map(f=>`
      <div class="rev ${f.read_by_student?'':'no'}" style="border-right-color:${f.read_by_student?'var(--cyan)':'var(--sand)'}">
        <div class="rev-q">${esc(f.quizzes?.title||'')} ${f.read_by_student?'':'<span class="badge lock">جديد</span>'}</div>
        <div class="line">${new Date(f.submitted_at).toLocaleDateString('ar-EG')} · اختيار ${AR(f.score)}/${AR(f.total)} (${AR(f.pct)}٪)${f.essay_score!=null?` · مقالي: ${AR(f.essay_score)}`:''}</div>
        <div class="model" style="background:rgba(72,207,192,.07)">${esc(f.teacher_comment).replace(/\n/g,"<br>")}</div>
      </div>`).join(""):'<div class="status">لا توجد ملاحظات بعد</div>'}
    <div class="nav" style="margin-top:16px"><button class="btn primary" id="bk">رجوع</button></div>`;
  document.getElementById("bk").onclick=loadList;

  const unread=list.filter(f=>!f.read_by_student).map(f=>f.id);
  if(unread.length) await db.from('attempts').update({read_by_student:true}).in('id',unread);
}

/* ═══════════ ⑥ المحادثة ═══════════ */
async function loadChat(){
  bar.innerHTML=""; head("مراسلة المعلم", S.prof.full_name);
  app.innerHTML=`<div class="status">جارٍ التحميل…</div>`;
  const { data } = await db.from('messages').select('*, profiles!messages_sender_id_fkey(full_name)')
    .eq('student_id',S.user.id).order('created_at');
  renderChat(data||[]);
  await db.from('messages').update({read_by_student:true})
    .eq('student_id',S.user.id).eq('sender_role','teacher').eq('read_by_student',false);
}

function bubble(m, mine){
  return `<div class="msg ${mine?'me':'them'}">
    <div class="who">${esc(m.profiles?.full_name||(m.sender_role==='teacher'?'المعلم':'أنا'))}</div>
    <div>${esc(m.body).replace(/\n/g,"<br>")}</div>
    <div class="tm">${new Date(m.created_at).toLocaleString('ar-EG',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div>`;
}

function renderChat(msgs){
  app.innerHTML=`
    ${msgs.length?`<div class="chat">${msgs.map(m=>bubble(m,m.sender_role==='student')).join("")}</div>`
      :'<div class="status">لا توجد رسائل بعد — اكتب سؤالك أدناه</div>'}
    <div class="card"><label class="fl">رسالتك</label>
      <textarea id="mt" placeholder="اكتب سؤالك العلمي…"></textarea></div>
    <div class="nav">
      <button class="btn primary" id="snd">إرسال</button>
      <button class="btn ghost" id="rf">تحديث</button>
    </div>
    <div class="nav"><button class="btn ghost" id="bk">رجوع</button></div>`;
  document.getElementById("bk").onclick=loadList;
  document.getElementById("rf").onclick=loadChat;
  document.getElementById("snd").onclick=async()=>{
    const t=(document.getElementById("mt").value||"").trim();
    if(!t){ toast("اكتب رسالتك أولاً"); return; }
    const { error } = await db.from('messages').insert({
      student_id:S.user.id, sender_id:S.user.id, sender_role:'student',
      body:t, read_by_student:true });
    toast(error?"تعذّر الإرسال":"أُرسلت رسالتك"); loadChat();
  };
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

/* ═══════════ ⑦ لوحة المعلم ═══════════ */
async function loadTeacher(){
  bar.innerHTML=""; head("لوحة المعلم — "+S.prof.full_name,"الإجابات المقالية بانتظار تصحيحك");
  app.innerHTML=`<div class="status">جارٍ التحميل…</div>`;
  const { data } = await db.from('attempts')
    .select('id,submitted_at,score,total,pct,essay_score,teacher_comment,profiles(full_name,klass),quizzes(title)')
    .order('submitted_at',{ascending:false}).limit(200);

  const all=data||[];
  const wait=all.filter(a=>!a.teacher_comment), done=all.filter(a=>a.teacher_comment);
  const card=(a,d)=>`<div class="pend ${d?'done':''}" data-a="${a.id}">
      <div class="qz-t">${esc(a.profiles?.full_name||'')}</div>
      <div class="qz-m">${esc(a.quizzes?.title||'')} · ${AR(a.score)}/${AR(a.total)} (${AR(a.pct)}٪) · ${new Date(a.submitted_at).toLocaleDateString('ar-EG')}</div>
    </div>`;

  app.innerHTML=`
    <div class="subtabs">
      <div class="tab on" id="t1">تصحيح المقالي</div>
      <div class="tab" id="t2">الرسائل</div>
    </div>
    <h2 class="sec">بانتظار التصحيح (${AR(wait.length)})</h2>
    ${wait.length?wait.map(a=>card(a,false)).join(""):'<div class="status">لا توجد محاولات معلّقة 🎉</div>'}
    ${done.length?`<h2 class="sec">مُصحَّحة</h2>${done.slice(0,20).map(a=>card(a,true)).join("")}`:''}
    <div class="nav" style="margin-top:18px">
      <button class="btn ghost" id="rf">تحديث</button>
      <button class="btn ghost" id="out">خروج</button>
    </div>`;

  app.querySelectorAll(".pend").forEach(el=>el.onclick=()=>openGrade(+el.dataset.a));
  document.getElementById("t2").onclick=loadInbox;
  document.getElementById("rf").onclick=loadTeacher;
  document.getElementById("out").onclick=signOut;
}

async function openGrade(id){
  app.innerHTML=`<div class="status">جارٍ الفتح…</div>`;
  const { data:a } = await db.from('attempts')
    .select('*,profiles(full_name),quizzes(title)').eq('id',id).single();
  const { data:ans } = await db.from('answers')
    .select('essay_text,questions(body,kind,position)').eq('attempt_id',id);

  const essays=(ans||[]).filter(x=>x.questions?.kind==='essay')
    .sort((x,y)=>x.questions.position-y.questions.position);

  head("تصحيح مقالي", a.profiles?.full_name);
  app.innerHTML=`
    <div class="card">
      <div class="qnum">${esc(a.quizzes?.title||'')} · ${new Date(a.submitted_at).toLocaleString('ar-EG')}</div>
      <div class="line">اختيار من متعدد: ${AR(a.score)}/${AR(a.total)} (${AR(a.pct)}٪)</div>
      ${essays.map(e=>`
        <div style="margin-top:14px">
          <div class="rev-q">${esc(e.questions.body)}</div>
          <div class="essaybox">${esc(e.essay_text||'— لم تُكتب —')}</div>
        </div>`).join("")}
      <label class="fl">درجة الأسئلة المقالية</label>
      <input type="text" id="es" inputmode="decimal" value="${a.essay_score??''}" placeholder="مثال: 4.5">
      <label class="fl" style="margin-top:16px">ملاحظاتك للطالب</label>
      <textarea id="fb" placeholder="اكتب التشخيص والخطة العلاجية…">${esc(a.teacher_comment||'')}</textarea>
    </div>
    <div class="nav">
      <button class="btn primary" id="sv">حفظ وإرسال</button>
      <button class="btn ghost" id="bk">رجوع</button>
    </div>`;

  document.getElementById("bk").onclick=loadTeacher;
  document.getElementById("sv").onclick=async()=>{
    const es=(document.getElementById("es").value||"").trim();
    const fb=(document.getElementById("fb").value||"").trim();
    if(!fb){ toast("اكتب ملاحظاتك أولاً"); return; }
    const { error } = await db.from('attempts').update({
      essay_score: es===''?null:Number(es), teacher_comment: fb,
      graded_at: new Date().toISOString(), graded_by: S.user.id, read_by_student: false
    }).eq('id',id);
    toast(error?"تعذّر الحفظ":"أُرسلت الملاحظات"); loadTeacher();
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

async function loadInbox(){
  bar.innerHTML=""; head("رسائل الطلاب", S.prof.full_name);
  app.innerHTML=`<div class="status">جارٍ التحميل…</div>`;
  const { data } = await db.from('messages')
    .select('*, student:profiles!messages_student_id_fkey(full_name)')
    .order('created_at',{ascending:false}).limit(500);

  const map={};
  (data||[]).forEach(m=>{
    if(!map[m.student_id]) map[m.student_id]={id:m.student_id,
      name:m.student?.full_name||'طالب', last:m.body.slice(0,70), at:m.created_at, unread:0};
    if(m.sender_role==='student' && !m.read_by_teacher) map[m.student_id].unread++;
  });
  const thr=Object.values(map).sort((a,b)=>b.unread-a.unread);

  app.innerHTML=`
    <div class="subtabs">
      <div class="tab" id="t1">تصحيح المقالي</div>
      <div class="tab on" id="t2">الرسائل</div>
    </div>
    ${thr.length?thr.map(t=>`
      <div class="thr" data-i="${t.id}">
        <div><div class="qz-t">${esc(t.name)}</div>
          <div class="qz-m">${esc(t.last)}… · ${new Date(t.at).toLocaleDateString('ar-EG')}</div></div>
        ${t.unread?`<span class="dot">${AR(t.unread)} جديد</span>`:''}
      </div>`).join(""):'<div class="status">لا توجد رسائل بعد</div>'}
    <div class="nav" style="margin-top:16px">
      <button class="btn ghost" id="rf">تحديث</button>
      <button class="btn ghost" id="out">خروج</button>
    </div>`;

  document.getElementById("t1").onclick=loadTeacher;
  document.getElementById("rf").onclick=loadInbox;
  document.getElementById("out").onclick=signOut;
  app.querySelectorAll(".thr").forEach(el=>el.onclick=()=>openThread(el.dataset.i));
}

async function openThread(sid){
  app.innerHTML=`<div class="status">جارٍ الفتح…</div>`;
  const { data } = await db.from('messages')
    .select('*, profiles!messages_sender_id_fkey(full_name)')
    .eq('student_id',sid).order('created_at');

  head("محادثة", data?.[0]?.profiles?.full_name||'');
  app.innerHTML=`
    <div class="chat">${(data||[]).map(m=>bubble(m,m.sender_role==='teacher')).join("")}</div>
    <div class="card"><label class="fl">ردّك</label>
      <textarea id="rt" placeholder="اكتب ردّك العلمي…"></textarea></div>
    <div class="nav">
      <button class="btn primary" id="sr">إرسال الرد</button>
      <button class="btn ghost" id="bk">رجوع</button>
    </div>`;
  document.getElementById("bk").onclick=loadInbox;
  document.getElementById("sr").onclick=async()=>{
    const t=(document.getElementById("rt").value||"").trim();
    if(!t){ toast("اكتب ردّك أولاً"); return; }
    const { error } = await db.from('messages').insert({
      student_id:sid, sender_id:S.user.id, sender_role:'teacher',
      body:t, read_by_teacher:true });
    toast(error?"تعذّر الإرسال":"أُرسل الرد"); openThread(sid);
  };
  await db.from('messages').update({read_by_teacher:true})
    .eq('student_id',sid).eq('sender_role','student').eq('read_by_teacher',false);
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

/* ═══════════ التشغيل ═══════════ */
db.auth.onAuthStateChange((e)=>{ if(e==='SIGNED_OUT'){ GATE="login"; renderGate(); } });
boot();
</script>
