<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- لون شريط المتصفح في الجوّال — يسكن هنا وحده، ويقرؤه سطرُ head أدناه و toggleTheme في ui.js.
     ⚠️ يُكرِّر --page من base.css اضطراراً: هذا يُقرأ قبل أن تُحمَّل CSS.
     غيّرتَ --page؟ غيّر data-light هنا. -->
<meta name="theme-color" data-light="#F5F5F4" data-dark="#171717">
<meta name="description" content="بيان — منصة تعلم عربية تشرح لك لماذا أخطأت، لا أنك أخطأت فقط.">
<title>بيان — تعلم صح</title>

<script>try{var t=localStorage.getItem("bayan.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=m.dataset[t==="dark"?"dark":"light"];</script>
  
<!-- أيقونة الموقع — أربعُ صيغٍ لأربعة قرّاء، والعلامةُ واحدة:
     ico لمن لا يقرأ SVG ولمن يطلب /favicon.ico بلا سؤال (وsizes="32x32"
     عمداً: بها يُقدِّم Chrome الـSVG عليه) · svg للمتصفّحات الحديثة ·
     apple-touch لشاشة iOS الرئيسة · png ١٩٢ لاختصار Android.
     غُيّرت العلامة؟ الأربعُ تُولَّد معاً من favicon.svg — لا واحدةٌ دون أخواتها. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Readex+Pro:wght@400;600&family=Amiri&family=Nunito:wght@900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- شريط علوي لاصق: يشغله عدّاد الاختبار -->
<div id="bar"></div>

<div class="wrap">
  <header>
    <div class="brand has-logo" id="brand">
  <svg class="brand-logo full" viewBox="19 0 484 250" role="img" aria-label="بيان" focusable="false">  <!-- «بيان» علامةً هندسية — أكتوبر ٢٠٢٦ · المصدر لوح «A · Versions» -->
  <!-- ١ · الحبر يُكتب من اليمين: صندوق الباء بألفها، ثم وعاء النون.
       الحبر كلُّه ضرباتٌ (stroke ٣٤ مستديرة الأطراف) لا حروفٌ مصمتة —
       فلا ثقوب في هذه العلامة ولا حاجةَ لـ --logo-hole (بقيت مُعرَّفةً
       في base.css لتاريخها).
       وviewBox مقيسٌ على مدى الحبر مع أنصاف الأطراف (٢٣→٤٩٩ × ٣→٢٤٧)
       لا منقولٌ عن مصدّر — والهامش ٣ وحدات.
       📌 ٦ أكتوبر — مُدّت الباء والياء: كانت نقطةُ الباء تبرز عن حدّ
       الكلمة الأيمن، فمُدّت الباء حتى دخلت نقطتُها تحتها، ثم مُدّت الياء
       لتتساوى القوائم الثلاث (ا ٢٨٢ · ي ٣٨٢ · ب ٤٨٢ — مئةٌ بين كلّ اثنتين). -->
  <g class="part write" style="--d:0s">
    <path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" d="M482 104 V146 A30 30 0 0 1 452 176 H312 A30 30 0 0 1 282 146 V20"/>
    <path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" d="M382 104 V176"/>
    <path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" d="M40 104 V128 A80 80 0 0 0 200 128 V104"/>
  </g>
    <!-- ٢ · الورقتان تتفتّحان من وعاء النون — فيروزيٌّ وذهبيّ: هويةٌ ثابتة لا تتبع السِمة -->
  <path class="part grow" fill="#42B7B4" style="--d:1.05s;--o:right bottom" d="M115 184 C113 140 100 102 74 74 C62 118 80 160 115 184 Z"/>
  <path class="part grow" fill="#D6B76D" style="--d:1.15s;--o:left bottom" d="M125 184 C127 140 140 102 166 74 C178 118 160 160 125 184 Z"/>
    <!-- ٣ · كلُّ نقطةٍ مع حرفها: الباء ثم الياء بنقطتيها ثم النون.
       التأخير = لحظةُ بلوغ القلم مركزَ النقطة، محسوبةً بعكس منحنى
       sp-write (cubic-bezier(.65,0,.35,1) · ٠٫٩٥ث) على مدى الحبر
       (٤٩٩→٢٣): ب ٠٫٢٦ · ي ٠٫٣٩ و٠٫٤٣ · ن ٠٫٦٠.
       غيّرتَ مدّة sp-write أو منحناها أو الشعار؟ أعِد الحساب. -->
  <circle class="part drop" fill="var(--logo-ink)" style="--d:.26s" cx="458" cy="226" r="21"/>
  <circle class="part drop" fill="var(--logo-ink)" style="--d:.39s" cx="374" cy="226" r="21"/>
  <circle class="part drop" fill="var(--logo-ink)" style="--d:.43s" cx="324" cy="226" r="21"/>
  <circle class="part drop" fill="var(--logo-ink)" style="--d:.60s" cx="120" cy="40" r="21"/>
</svg>
  <svg class="brand-logo compact" viewBox="19 0 484 250" role="img" aria-label="بيان" focusable="false"><path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" d="M482 104 V146 A30 30 0 0 1 452 176 H312 A30 30 0 0 1 282 146 V20"/><path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" d="M382 104 V176"/><path fill="none" stroke="var(--logo-ink)" stroke-width="34" stroke-linecap="round" d="M40 104 V128 A80 80 0 0 0 200 128 V104"/><path fill="#42B7B4" d="M115 184 C113 140 100 102 74 74 C62 118 80 160 115 184 Z"/><path fill="#D6B76D" d="M125 184 C127 140 140 102 166 74 C178 118 160 160 125 184 Z"/><circle fill="var(--logo-ink)" cx="120" cy="40" r="21"/><circle fill="var(--logo-ink)" cx="324" cy="226" r="21"/><circle fill="var(--logo-ink)" cx="374" cy="226" r="21"/><circle fill="var(--logo-ink)" cx="458" cy="226" r="21"/></svg>
  <span class="brand-text">
    <span class="brand-name">بيان</span>
    <span class="brand-latin" dir="ltr" aria-hidden="true">BAYAN</span>
    <span class="brand-slogan">تعلَّم صح</span>
  </span>
</div>
    <h1 id="head"></h1>
    <p class="sub" id="subhead"></p>
  </header>

  <!-- كل الشاشات تُرسم داخل هذا العنصر -->
  <div id="app"><div class="status">جارٍ الاتصال…</div></div>
</div>

<!-- تذييل الموقع: صفحاتٌ ثابتة لا تحتاج دخولاً ولا جافاسكربت.
     خارج .wrap عمداً — لا يتبع عرضَ المحتوى ولا يُمحى مع #app. -->
<footer class="site-foot">
  <a href="privacy.html">سياسة الخصوصية</a>
</footer>

<div class="toast" id="toast">تم</div>

<!-- أطرُ علامة الحساب — تُعرَّف مرّةً وتُستدعى بـ<use> من كلّ علامة (125).
     ⚠️ وساكنةٌ في المستند لا مُولَّدةٌ بجافاسكربت: `<use>` تحتاج هدفَها
        موجوداً لحظةَ الرسم، وعلامةٌ تُرسم قبل الحقن تخرج بلا إطارٍ صامتةً.
     ⚠️ و`width/height=0` لا `display:none`: المخفيُّ لا يُصيَّر في بعض
        المحرّكات فلا يجد `<use>` هدفاً. والصفرُ يحجز لا شيء ويبقى حيّاً.
     📌 والمصدرُ في js/avatar.js — دالّةُ avatarDefs() تُخرج هذا نصّاً
        لمن أراد توليدَه، وهذه نسختُه الساكنة. غُيّر أحدُهما؟ غيّر الآخر. -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute"><defs>
  <g id="avf-star"><polygon points="76.87,76.87 23.13,76.87 23.13,23.13 76.87,23.13"/><polygon points="88.00,50.00 50.00,88.00 12.00,50.00 50.00,12.00"/></g>
  <g id="avf-oct"><polygon points="85.11,64.54 64.54,85.11 35.46,85.11 14.89,64.54 14.89,35.46 35.46,14.89 64.54,14.89 85.11,35.46"/></g>
  <g id="avf-ring"><circle cx="88.00" cy="50.00" r="6.2"/><circle cx="76.87" cy="76.87" r="6.2"/><circle cx="50.00" cy="88.00" r="6.2"/><circle cx="23.13" cy="76.87" r="6.2"/><circle cx="12.00" cy="50.00" r="6.2"/><circle cx="23.13" cy="23.13" r="6.2"/><circle cx="50.00" cy="12.00" r="6.2"/><circle cx="76.87" cy="23.13" r="6.2"/></g>
</defs></svg>

<noscript>
  <div class="wrap"><div class="err"><b>جافاسكربت معطّلة</b>
    تُفعَّل في المتصفح لتعمل المنصة.</div></div>
</noscript>

<script type="module">
  import { start } from './js/auth.js';
  start();
</script>
</body>
</html>
