       ② ٨ أكتوبر — ونقطتا الياء كانتا متوسطتين على امتداد الحرف كلِّه

       ③ القاعُ ينهض ستَّ وحداتٍ تحت الياء وحدها (مستقيمٌ حتى ٤٣٥ ·

<!-- 🆕 b139 · إعلانُ التعثّر — **من الشيفرة بعد مُهلة، لا من HTML قبلها.**

     كان في `#app` سطرٌ ساكن «جارٍ الاتصال…» يظهر في كلّ إقلاع ثمّ يُمحى
     بأوّل شاشة. وعيبُه اثنان: يومض في الإقلاع السويّ بلا حاجة، **ويكذب
     حين لا يصل الاتصال أصلاً** — يقول «جارٍ» وما من شيءٍ يجري. فرُفع،
     وخلت نافذةُ الإقلاع. **والخلوُّ لحظةً صحيح، وطويلاً صمتٌ يُصدَّق**
     (AGENTS §٥·⑤) ⇒ مُهلةٌ واحدة تنطق إن لم تُرسم شاشة.

     🔴 **ونصٌّ داخليٌّ عاديّ لا وحدةُ ES — وهذا قِيس لا رُجِّح.** وُضعت
        المُهلة أوّلاً في `start()` بـjs/auth.js فلم تنطق البتّة: العطلُ
        الذي تحرسه هو بعينه تعثُّرُ شجرة الوحدات (api.js يستورد Supabase
        من الشبكة)، **فما يحرسه داخلَها لا يعمل حين يقع.** والنصُّ
        الداخليّ يجري عند بلوغ المحلِّل سطرَه، ولا يرث تعثُّرَ أحد.
     🔑 ويحرس الحالتين معاً: وحدةٌ لم تصل، وجلسةٌ أبطأت.
     🔑 ولا مؤقّتَ يُلغى ولا علمَ يُرفع: الشرطُ **ما في `#app` فعلاً**.
        فكلُّ شاشةٍ تكتب `innerHTML`، ومن سبقت المُهلةَ وجدتها ممتلئة
        فسكتت. ⇒ لا سطرَ إلغاءٍ يُنسى في شاشةٍ تُكتب بعد سنة.
     ⚠️ والمدّة ٢٫٥ث لا أقلّ: الإقلاع السويّ دونها بكثير، فلا يراها إلا
        من تعثّر فعلاً. وأقلُّ منها يُعيد الوميضَ الذي رُفع.
     📌 و«ربما تكون المشكلة في الاتصال» اسمٌ قائمٌ في المنصّة لا جديد —
        js/analytics.js · js/student.js · js/simulations.js (قرار b105).
        واسمٌ ثالثٌ لمفهومٍ له اسمان يُهجَر. -->
<script>
  setTimeout(function () {
    var a = document.getElementById('app');
    if (a && !a.children.length)
      a.innerHTML = '<div class="status" data-nosnippet>' +
        'التحميل يطول — ربما تكون المشكلة في الاتصال</div>';
  }, 2500);
</script>

<script type="module">

</script>
